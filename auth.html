<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подключение к Twitch… — Strimix</title>
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%239146FF'/%3E%3Cpath d='M5 17h5l3-7 4 12 3-8 2 3h5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <main class="auth-page" id="auth">
    <div class="beam" aria-hidden="true"></div>

    <div class="auth-card" role="status" aria-live="polite">
      <div class="auth-link" aria-hidden="true">
        <div class="auth-node self">
          <svg viewBox="0 0 24 24"><path d="M3 13h4l2.2-5.5L13 18l2.3-6 1.7 2.5H21" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="auth-dots"><i></i><i></i><i></i><i></i></div>
        <div class="auth-node remote">
          <!-- нейтральная иконка «трансляция», не логотип Twitch -->
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4" fill="#BF94FF"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14" fill="none" stroke="#BF94FF" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <div class="auth-state">
        <div class="spinner"></div>
        <svg class="check" viewBox="0 0 84 84" aria-hidden="true">
          <circle cx="42" cy="42" r="38"/>
          <path d="M26 43l11 11 21-23"/>
        </svg>
      </div>

      <h1 class="auth-title" id="authTitle">Подключение к Twitch…</h1>
      <div class="auth-status" id="authStatus"><span>Установка соединения…</span></div>

      <ul class="auth-steps" id="authSteps">
        <li>Проверка разрешений…</li>
        <li>Синхронизация канала…</li>
        <li>Готово</li>
      </ul>

      <div class="auth-progress"><div id="authBar"></div></div>
      <p class="auth-note">Strimix · безопасное подключение</p>
    </div>
  </main>

  <script src="js/auth.js?v=3"></script>
</body>
</html>
